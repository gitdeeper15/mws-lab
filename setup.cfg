[metadata]
name = mws-lab
version = 1.0.0
description = Water Scarcity in Morocco: A Multivariate Analysis of Climatic, Agricultural, and Socioeconomic Drivers
long_description = file: README.md
long_description_content_type = text/markdown
author = Samir Baladi
author_email = gitdeeper@gmail.com
license = MIT
license_files = LICENSE
project_urls =
    Homepage = https://mws-lab.netlify.app
    Website = https://mws-lab.netlify.app
    PyPI = https://pypi.org/project/mws-lab/
    Figshare = https://doi.org/10.6084/m9.figshare.34884417
    Figshare = https://doi.org/10.6084/m9.figshare.34884417
    Manuscript = https://doi.org/10.5281/zenodo.23884236
    Zenodo = https://doi.org/10.5281/zenodo.23884236
    ORCID = https://orcid.org/0009-0003-8903-0029
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Atmospheric Science
    Topic :: Scientific/Engineering :: Information Analysis

[options]
packages = find:
install_requires =
    pandas>=1.5.0
    numpy>=1.23.0
    scipy>=1.9.0
    statsmodels>=0.13.0
    matplotlib>=3.6.0
    seaborn>=0.12.0
    requests>=2.28.0
python_requires = >=3.9

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*
    PUBLICATION
    PUBLICATION.*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,venv,.venv,PUBLICATION

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[coverage:run]
source = morocco_water_scarcity
omit = */tests/*,*/test_*,*/.git/*,*/__pycache__/*,.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
show_missing = True
skip_covered = True
