[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mws-lab"
version = "1.0.0"
description = "Water Scarcity in Morocco: A Multivariate Analysis of Climatic, Agricultural, and Socioeconomic Drivers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
maintainers = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
keywords = [
    "water scarcity",
    "morocco",
    "world bank indicators",
    "OLS regression",
    "environmental science",
    "water policy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Manuscript = "https://doi.org/10.5281/zenodo.23884236"
Website = "https://mws-lab.netlify.app"
PyPI = "https://pypi.org/project/mws-lab/"
Figshare = "https://doi.org/10.6084/m9.figshare.34884417"
Zenodo = "https://doi.org/10.5281/zenodo.23884236"
ORCID = "https://orcid.org/0009-0003-8903-0029"

[project.scripts]
mws-lab-fetch = "mws_lab.fetch:main"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["mws_lab"]

[tool.setuptools.package-data]
mws_lab = ["data/*.csv", "data/*.json"]
